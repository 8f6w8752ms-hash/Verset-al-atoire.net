<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Un jour, une histoire</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 1.2rem;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,0.45), transparent 35%),
        radial-gradient(circle at 85% 90%, rgba(183,139,62,0.12), transparent 38%),
        linear-gradient(145deg, #fffaf0 0%, #f7eed9 45%, #ead9b5 100%);
      color: #4a3824;
    }

    .site {
      width: 100%;
      max-width: 850px;
      margin: auto;
    }

    /* =========================
       MENU HAMBURGER
    ========================= */
    .menu-btn {
      position: fixed;
      top: 22px;
      left: 22px;
      width: 52px;
      height: 52px;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 16px;
      background: rgba(255,252,244,0.88);
      border: 1px solid rgba(122,74,26,0.2);
      box-shadow: 0 8px 25px rgba(92,59,28,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .menu-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 30px rgba(92,59,28,0.2);
    }

    .menu-btn span {
      width: 21px;
      height: 2px;
      border-radius: 5px;
      background: #7a4a1a;
    }

    /* =========================
       EN-TÊTE
    ========================= */
    header {
      text-align: center;
      margin: 3.5rem 0 2.8rem;
    }

    .croix {
      width: 74px;
      height: 74px;
      margin: 0 auto 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: linear-gradient(145deg, #fffdf8, #f3e8cc);
      border: 1px solid rgba(184,134,11,0.25);
      color: #b8860b;
      font-size: 3rem;
      box-shadow: 0 12px 30px rgba(122,74,26,0.14), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    h1 {
      margin: 0;
      color: #70451f;
      font-size: clamp(2.2rem, 7vw, 3.5rem);
      line-height: 1.05;
      letter-spacing: -0.5px;
    }

    .sous-titre {
      margin: 1rem auto 0;
      max-width: 520px;
      color: #907755;
      font-style: italic;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    header::after {
      content: "";
      display: block;
      width: 58px;
      height: 2px;
      margin: 1.4rem auto 0;
      background: #b8860b;
      border-radius: 20px;
      opacity: 0.75;
    }

    /* =========================
       CARTE HISTOIRE
    ========================= */
    .histoire {
      position: relative;
      background: rgba(255,253,247,0.72);
      border: 1px solid rgba(184,134,11,0.24);
      border-radius: 28px;
      padding: 2.4rem;
      box-shadow: 0 20px 50px rgba(122,74,26,0.13), inset 0 1px 0 rgba(255,255,255,0.85);
      animation: apparition 0.6s ease;
      overflow: hidden;
    }

    .histoire::before {
      content: "";
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 3px;
      background: linear-gradient(90deg, transparent, #b8860b, transparent);
      opacity: 0.7;
    }

    .histoire::after {
      content: "✦";
      position: absolute;
      top: 18px;
      right: 24px;
      color: #b8860b;
      opacity: 0.28;
      font-size: 1.2rem;
    }

    @keyframes apparition {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .histoire h2 {
      margin: 0 auto 1.8rem;
      max-width: 650px;
      text-align: center;
      color: #70451f;
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      line-height: 1.2;
    }

    .histoire h2::after {
      content: "";
      display: block;
      width: 42px;
      height: 2px;
      margin: 1rem auto 0;
      background: #b8860b;
      border-radius: 20px;
      opacity: 0.7;
    }

    #texte-histoire {
      max-width: 680px;
      margin: auto;
      color: #5b4932;
      font-size: 1.08rem;
      line-height: 1.9;
      white-space: pre-line;
      text-align: left;
    }

    .encouragement {
      max-width: 680px;
      margin: 2.3rem auto 0;
      padding: 1.5rem 1.4rem;
      border-left: 3px solid #b8860b;
      border-right: 3px solid #b8860b;
      border-radius: 16px;
      background: rgba(184,134,11,0.065);
      color: #70451f;
      text-align: center;
      font-style: italic;
      font-size: 1.03rem;
      line-height: 1.75;
    }

    .reference {
      margin-top: 1.7rem;
      text-align: center;
      color: #a87508;
      font-weight: bold;
      font-size: 0.95rem;
    }

    footer {
      margin: 3rem 0 1.5rem;
      text-align: center;
      color: #907755;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* =========================
       OVERLAY & MENU
    ========================= */
    .menu-overlay {
      position: fixed;
      inset: 0;
      background: rgba(59,47,30,0.28);
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
      z-index: 1100;
    }

    .menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .menu {
      position: fixed;
      top: 0;
      left: 0;
      width: min(340px, 88vw);
      height: 100vh;
      padding: 1.5rem;
      background: rgba(253,248,237,0.98);
      border-right: 1px solid rgba(184,134,11,0.22);
      box-shadow: 10px 0 40px rgba(59,47,30,0.17);
      transform: translateX(-105%);
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
      z-index: 1200;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0 1.3rem;
      border-bottom: 1px solid rgba(184,134,11,0.2);
      color: #70451f;
      font-size: 1.45rem;
      font-weight: bold;
    }

    .menu-close {
      min-width: 0;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: rgba(184,134,11,0.08);
      color: #70451f;
      font-size: 1.8rem;
      box-shadow: none;
      border: 1px solid rgba(184,134,11,0.16);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .menu-close:hover {
      background: rgba(184,134,11,0.15);
      transform: rotate(5deg);
    }

    .menu-content {
      padding-top: 1.5rem;
    }

    .menu-content a {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.6rem;
      padding: 0.9rem;
      border-radius: 18px;
      color: #5b4932;
      text-decoration: none;
      border: 1px solid transparent;
      transition: background 0.2s ease, transform 0.2s ease, border 0.2s ease;
    }

    .menu-content a:hover {
      background: rgba(184,134,11,0.08);
      border: 1px solid rgba(184,134,11,0.14);
      transform: translateX(4px);
    }

    .menu-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border-radius: 14px;
      background: rgba(184,134,11,0.1);
      border: 1px solid rgba(184,134,11,0.15);
      font-size: 1.35rem;
    }

    .menu-content strong {
      display: block;
      color: #70451f;
      font-size: 1rem;
    }

    .menu-content small {
      display: block;
      margin-top: 4px;
      color: #907755;
      font-size: 0.78rem;
      line-height: 1.4;
    }

    /* =========================
       BOUTON « LIRE » & TEXTE BIBLIQUE
       (sortis de la media query pour s'appliquer
        sur toutes les tailles d'écran)
    ========================= */
    .bouton-lire {
      display: block;
      margin: 2rem auto 0;
      padding: 0.85rem 1.8rem;
      border: 1px solid rgba(184,134,11,0.3);
      border-radius: 14px;
      background: linear-gradient(145deg, #fffdf8, #f3e8cc);
      color: #70451f;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(122,74,26,0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .bouton-lire:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 25px rgba(122,74,26,0.18);
    }

    #texte-biblique {
      display: none;
      max-width: 680px;
      margin: 1.8rem auto 0;
      padding-top: 1.8rem;
      border-top: 1px solid rgba(184,134,11,0.2);
      color: #5b4932;
      font-size: 1rem;
      line-height: 1.9;
      white-space: pre-line;
      text-align: left;
    }

    @media (max-width: 600px) {
      body { padding: 0.9rem; }
      header { margin-top: 4.3rem; margin-bottom: 2.3rem; }
      .croix { width: 65px; height: 65px; border-radius: 16px; font-size: 2.7rem; }
      h1 { font-size: 2.35rem; }
      .sous-titre { font-size: 0.98rem; }
      .histoire { padding: 1.55rem; border-radius: 25px; }
      .histoire h2 { font-size: 1.85rem; margin-bottom: 1.5rem; }
      #texte-histoire { font-size: 1rem; line-height: 1.8; }
      .encouragement { padding: 1.25rem 1rem; font-size: 0.98rem; }
      .menu-btn { top: 15px; left: 15px; width: 48px; height: 48px; border-radius: 14px; }
      .menu { width: min(330px, 88vw); padding: 1.3rem; }
    }
  </style>
</head>

<body>

  <!-- =========================
       MENU HAMBURGER
  ========================= -->
  <button class="menu-btn" id="menu-btn" aria-label="Ouvrir le menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="menu-overlay" id="menu-overlay"></div>

  <nav class="menu" id="menu">
    <div class="menu-header">
      <span>Menu</span>
      <button class="menu-close" id="menu-close" aria-label="Fermer le menu">×</button>
    </div>

    <div class="menu-content">
      <!-- ACCUEIL -->
      <a href="index.html">
        <span class="menu-icon">🏠</span>
        <span>
          <strong>Accueil</strong>
          <small>Retourner à l'accueil.</small>
        </span>
      </a>

      <!-- HISTOIRES BIBLIQUES -->
      <a href="un-jour-une-histoire.html">
        <span class="menu-icon">📖</span>
        <span>
          <strong>Un jour, une histoire</strong>
          <small>Une histoire, un encouragement.</small>
        </span>
      </a>

      <!-- STICKERS (CORRIGÉ AVEC target="_blank") -->

  <div class="site">
    <header>
      <div class="croix">✝</div>
      <h1>Un jour, une histoire</h1>
      <p class="sous-titre">Une histoire biblique, un encouragement.</p>
    </header>

    <main>
      <article class="histoire">
        <h2 id="titre-histoire">Chargement...</h2>
        <div id="texte-histoire">Chargement de l'histoire...</div>
<button class="bouton-lire" id="bouton-lire">Lire</button>

<div id="texte-biblique"></div>
        <div class="encouragement" id="encouragement"></div>
        <div class="reference" id="reference"></div>
      </article>
    </main>

    <footer>
      ✝<br><br>
      Jésus t'aime — Que sa paix t'accompagne.

  <!-- =========================
       IMPORT DU FICHIER JS
  ========================= -->
  <script src="histoires.js"></script>

  <!-- =========================
       LOGIQUE JAVASCRIPT
  ========================= -->
<script>
 /* =========================
   UNE HISTOIRE PAR JOUR
========================= */

function obtenirJourFrance() {
  const maintenant = new Date();

  const parties = new Intl.DateTimeFormat("fr-FR", {
    timeZone: "Europe/Paris",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(maintenant);

  let jour = 0;
  let mois = 0;
  let annee = 0;

  parties.forEach(partie => {
    if (partie.type === "day") jour = Number(partie.value);
    if (partie.type === "month") mois = Number(partie.value);
    if (partie.type === "year") annee = Number(partie.value);
  });

  return { jour, mois, annee };
}


/* =========================
   NUMÉRO DU JOUR
========================= */

function calculerNumeroJour() {
  const date = obtenirJourFrance();

  const debut = new Date(date.annee, 0, 0);
  const actuel = new Date(
    date.annee,
    date.mois - 1,
    date.jour
  );

  const difference = actuel - debut;

  return Math.floor(
    difference / (1000 * 60 * 60 * 24)
  );
}


/* =========================
   AFFICHER L'HISTOIRE
========================= */

function afficherHistoireDuJour() {

  if (typeof histoires === "undefined" || histoires.length === 0) {

    document.getElementById("titre-histoire").textContent = "Erreur";

    document.getElementById("texte-histoire").textContent =
      "Impossible de charger le fichier histoires.js.";

    return;
  }

  const numeroJour = calculerNumeroJour();

  /*
     Le même jour = toujours la même histoire.
     Le jour suivant = histoire suivante.
  */
  const index = (numeroJour - 1) % histoires.length;

  const histoire = histoires[index];


  /* TITRE */
  document.getElementById("titre-histoire").textContent =
    histoire.titre;


  /* PETITE HISTOIRE */
  document.getElementById("texte-histoire").textContent =
    histoire.texte;


  /* RÉFÉRENCE BIBLIQUE */
  document.getElementById("reference").textContent =
    histoire.reference;


  /* TEXTE BIBLIQUE COMPLET */
  document.getElementById("texte-biblique").textContent =
    histoire.biblique;


  /*
     Ton fichier histoires.js n'a pas de propriété
     "encouragement".

     On évite donc d'afficher "undefined".
  */
  const encouragement =
    document.getElementById("encouragement");

  if (histoire.encouragement) {
    encouragement.textContent = histoire.encouragement;
  } else {
    encouragement.textContent = "";
    encouragement.style.display = "none";
  }
}


/* =========================
   BOUTON « LIRE »
========================= */

const boutonLire = document.getElementById("bouton-lire");
const texteBiblique = document.getElementById("texte-biblique");

boutonLire.addEventListener("click", function () {

  const estCache =
    texteBiblique.style.display === "none" ||
    texteBiblique.style.display === "";

  if (estCache) {

    texteBiblique.style.display = "block";

    boutonLire.textContent = "Fermer";

  } else {

    texteBiblique.style.display = "none";

    boutonLire.textContent = "Lire";
  }

});


/* =========================
   CHARGEMENT INITIAL
========================= */

afficherHistoireDuJour();


/* =========================
   CHANGEMENT AUTOMATIQUE
   À MINUIT EN FRANCE
========================= */

let dernierJour = calculerNumeroJour();

setInterval(function () {

  const nouveauJour = calculerNumeroJour();

  /*
     Si le numéro du jour a changé,
     on affiche automatiquement la nouvelle histoire.
  */
  if (nouveauJour !== dernierJour) {

    dernierJour = nouveauJour;

    afficherHistoireDuJour();

    /*
       On referme également le texte biblique
       pour la nouvelle histoire.
    */
    texteBiblique.style.display = "none";
    boutonLire.textContent = "Lire";
  }

}, 1000);


/* =========================
   MENU HAMBURGER
========================= */

const menuBtn = document.getElementById("menu-btn");
const menu = document.getElementById("menu");
const menuClose = document.getElementById("menu-close");
const menuOverlay = document.getElementById("menu-overlay");


function ouvrirMenu() {
  menu.classList.add("open");
  menuOverlay.classList.add("open");
  menuBtn.setAttribute("aria-expanded", "true");
}


function fermerMenu() {
  menu.classList.remove("open");
  menuOverlay.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
}


menuBtn.addEventListener("click", ouvrirMenu);

menuClose.addEventListener("click", fermerMenu);

menuOverlay.addEventListener("click", fermerMenu);


document.addEventListener("keydown", function(event) {

  if (event.key === "Escape") {
    fermerMenu();
  }

});


/* Fermer le menu lorsqu'on clique sur un lien */

const liensMenu =
  document.querySelectorAll(".menu-content a");

liensMenu.forEach(function(lien) {

  lien.addEventListener("click", function() {
    fermerMenu();
  });

}); </script>

</body>
